name: Vercel Deploy (identity-independent)

# main 进入生产前必须先通过 Node 全量回归 + Chromium 浏览器回归。
# 部署仍使用仓库 Secrets 中的 Vercel Token，不依赖推送者 GitHub 身份。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Verify and deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Node regression
        run: npm test

      - name: Install Chromium for browser regression
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Browser regression
        shell: bash
        run: |
          export ITM_TEST_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")"
          test -x "$ITM_TEST_CHROMIUM"
          npm run test:browser

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
